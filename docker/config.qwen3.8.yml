# TabbyAPI config for Qwen3.8-27B EXL3 (turboderp/Qwen3.8-27B-exl3, SC_4.00bpw_H5)
# Single RTX 4090 (24GB), sm_89

# run.sh uses this to pick the compose project/slug and checkpoint match.
model_slug: qwen38

network:
  host: 0.0.0.0
  port: 5000
  # Localhost-only exposure via docker port mapping; no API keys required.
  disable_auth: true
  api_servers: ["OAI"]
  sse_ping_interval: 15

model:
  model_dir: models
  model_name: Qwen3.8-27B-exl3
  backend: exllamav3

  # Start modest for 24GB; raise if it fits (multiple of 256).
  cache_size: 128000
  cache_mode: Q6

  # EXL3 output chunking stays enabled.
  output_chunking: true

  # Vision (image/video) supported by this checkpoint.
  vision: true

  # Qwen3.5/3.8 uses  tokens and an enable_thinking template var
  # (reasoning_effort defaults to xhigh when thinking is enabled).
  reasoning: true

  # Tool call parsing for Qwen3.5/3.8 (maps to the qwen3_coder parser).
  tool_format: qwen3_5

  # MTP speculative decoding (draft weights are embedded in this exl3 file).
  # Draft options must go in the top-level draft_model: section below, not here.

draft_model:
  draft_mode: mtp
  # Draft KV cache quantized to Q6; saves VRAM vs FP16 on the 1-layer MTP head.
  draft_cache_mode: Q6

logging:
  log_prompt: false
