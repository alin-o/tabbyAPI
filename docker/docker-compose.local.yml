# Local build of the alin-o/tabbyAPI fork, serving the Qwen3.8-27B EXL3
# checkpoint. Single RTX 4090 (24GB).
#
# Layout:
#   litellm  -> host port 8881 (only public service; adds /v1/responses)
#   tabbyapi -> internal only on 5000 (backend, chat completions)
#
# Usage:
#   docker compose -f docker/docker-compose.local.yml up -d --build
#
# Model is pre-downloaded into ./models/Qwen3.8-27B-exl3 (via `hf download`).
# LiteLLM reads ./litellm-config.yaml (with PostgreSQL for UI/history).

services:
  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  tabbyapi:
    build:
      context: ..
      # cu13 variant: torch 2.11.0+cu130 + exllamav3 1.4.2 wheels.
      # Driver 595.84 supports CUDA 13.2; the Dockerfile includes the
      # cuda-*-dev-13-2 packages Triton needs to JIT-compile kernels.
      dockerfile: ./docker/Dockerfile.cu13
    image: tabbyapi-local-qwen38
    gpus: all
    # No host port: litellm is the only public service (8881).
    # tabbyapi is reachable on the compose network at http://tabbyapi:5000.
    shm_size: "8g"
    ulimits:
      memlock: -1
      nofile: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NAME=TabbyAPI
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../models:/app/models
      - ./config.qwen3.8.yml:/app/config.yml:ro

  litellm:
    # Public gateway on 8881. Bridges /v1/responses to tabbyAPI's
    # /v1/chat/completions (and passes chat completions through).
    image: ghcr.io/berriai/litellm:main-latest
    command: [
      "--config", "/app/config/litellm-config.yaml",
      "--host", "0.0.0.0",
      "--port", "4000",
    ]
    ports:
      - "8881:4000"
    depends_on:
      tabbyapi:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    volumes:
      - ./litellm-config.yaml:/app/config/litellm-config.yaml:ro
    environment:
      - NAME=LiteLLM
      - DATABASE_URL=postgresql://litellm:litellm@litellm-db:5432/litellm
      - LITELLM_LOG=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  litellm-db-data:
