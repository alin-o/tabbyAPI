# Local build of the alin-o/tabbyAPI fork, serving whichever model
# ../run.sh started. Single RTX 4090 (24 GB) - only ONE model at a time,
# so this ONE file covers all models; run.sh picks everything up from the
# MODEL argument.
#
# MODEL selects (all named after <model>):
#   ./config.<model>.yml             -> tabbyAPI (KV cache, vision, MTP, tools)
#   ./litellm-config.<model>.yaml    -> litellm (model names + aliases to expose)
#   ../models/<dir name>             -> weights (see ../models/download-<model>.sh)
#
# MODEL_SLUG (default: qwen38) is the compose project name - it must be a
# valid docker compose project name (no dots). Each model gets its own
# project, its own litellm-db volume (separate UI history), and they share
# one tabbyapi image (no rebuild when switching models).
#
# run.sh: verifies configs + weights, stops any other live tabbyapi stack
# first (dumping its litellm DB to ../docker/ first, KEEP_OLD=1 refuses),
# then starts this one on port 8881.
#
# Layout:
#   litellm    -> host port 8881 (only public service; adds /v1/responses)
#   tabbyapi   -> internal only on 5000 (backend, chat completions)
#   litellm-db -> postgres, per-model project volume (UI/history persistence)
#
# Direct use (normally via ../run.sh):
#   MODEL=ornith MODEL_SLUG=ornith \
#     docker compose -f docker/docker-compose.local.yml up -d --force-recreate

name: ${MODEL_SLUG:-qwen38}

services:
  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  tabbyapi:
    build:
      context: ..
      # cu13 variant: torch 2.11.0+cu130 + exllamav3 1.4.2 wheels.
      # Driver supports CUDA 13.x; the Dockerfile includes the
      # cuda-*-dev packages Triton needs to JIT-compile kernels.
      dockerfile: ./docker/Dockerfile.cu13
    # One shared image for all models (same torch/exllamav3): switching
    # models never rebuilds, it only recreates the container with new
    # config mounts.
    image: tabbyapi-local-4090
    gpus: all
    # No host port: litellm on 8881 is the only public service.
    # tabbyapi is reachable on the compose network at http://tabbyapi:5000.
    shm_size: "8g"
    ulimits:
      memlock: -1
      nofile: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NAME=TabbyAPI
    volumes:
      - ../models:/app/models
      - ./config.${MODEL}.yml:/app/config.yml:ro

  litellm:
    # Public gateway on 8881. Bridges /v1/responses to tabbyAPI's
    # /v1/chat/completions (and passes chat completions through).
    image: ghcr.io/berriai/litellm:main-latest
    command: [
      "--config", "/app/config/litellm-config.yaml",
      "--host", "0.0.0.0",
      "--port", "4000",
    ]
    ports:
      - "8881:4000"
    depends_on:
      tabbyapi:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    volumes:
      - ./litellm-config.${MODEL}.yaml:/app/config/litellm-config.yaml:ro
    environment:
      - NAME=LiteLLM
      - DATABASE_URL=postgresql://litellm:litellm@litellm-db:5432/litellm
      - LITELLM_LOG=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  litellm-db-data: